<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智者智城・志在滨州</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 百度地图API（替换成你的AK） -->
    <script type="text/javascript" src="https://api.map.baidu.com/api?v=1.0&type=webgl&ak=ErMVgmh7QgYX3naRmzTsy0viDvOAeSJ9"></script>
    
    <script>
        // 配置Tailwind自定义颜色
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#87CEEB', // 主色调-深蓝色
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        dark: '#1F2937',
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .map-container {
                position: relative; /* 为信息窗提供定位参考 */
                overflow: hidden; /* 防止地图瓦片溢出 */
                height: 600px; /* 确保地图容器有高度 */
            }
            .location-marker {
                transition: all 0.3s ease;
            }
            .location-marker:hover {
                transform: scale(1.2);
            }
            .info-box {
                position: absolute; 
                z-index: 1000; /* 确保在地图上层 */
                transform-origin: top center;
                animation: fadeIn 0.3s ease forwards;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.9); }
                to { opacity: 1; transform: scale(1); }
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-primary text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold flex items-center">
                 <!--<i class="fa fa-map-marker mr-3"></i>标记-->
                <img src="111.jpg" alt="自定义标记图标" class="ml-4 mr-3 w-40 h-28">智者智城・志在滨州
            </h1>
            <p class="text-blue-100 mt-1">点击地图上的标记查看地点详情</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <!-- 地图控制区 -->
            <div class="p-4 bg-gray-50 border-b flex flex-wrap gap-2 justify-between items-center">
                <div class="flex items-center space-x-2">
                    <button id="zoomIn" class="bg-primary hover:bg-primary/90 text-white p-2 rounded-full transition-all">
                        <i class="fa fa-search-plus"></i>
                    </button>
                    <button id="zoomOut" class="bg-primary hover:bg-primary/90 text-white p-2 rounded-full transition-all">
                        <i class="fa fa-search-minus"></i>
                    </button>
                    <button id="resetMap" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1.5 rounded-md transition-all text-sm">
                        <i class="fa fa-refresh mr-1"></i>重置视图
                    </button>
                </div>
                <div class="text-sm text-gray-600">
                    <span class="font-medium"></span>Bright People, Bright City
                </div>
            </div>
            
            <!-- 地图容器 -->
            <div id="map" class="map-container w-full cursor-move"></div>
            
            <!-- 信息窗口 -->
            <div id="infoBox" class="info-box hidden absolute bg-white rounded-lg shadow-xl p-4 max-w-md z-50 border border-gray-200">
                <div class="flex justify-between items-start mb-3">
                    <h3 id="locationTitle" class="text-xl font-bold text-dark"></h3>
                    <button id="closeInfo" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <i class="fa fa-times text-lg"></i>
                    </button>
                </div>
                <div id="locationContent" class="space-y-4">
                    <!-- 内容会通过JS动态填充 -->
                </div>
            </div>
        </div>
        
        <!-- 地点列表 -->
        <div class="mt-8 bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold text-dark mb-4 flex items-center">
                <i class="fa fa-list-ul mr-2 text-primary"></i>滨州地点列表
            </h2>
            <div id="locationsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 地点列表会通过JS动态生成 -->
            </div>
        </div>
    
        <div id="imageModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" style="z-index: 2000;">
        <div class="relative w-full max-w-4xl">
            <!-- 关闭按钮 -->
            <button id="closeModal" class="absolute top-2 right-2 text-white text-2xl hover:text-gray-300">
                &times;
            </button>
            <!-- 上一张按钮 -->
            <button id="prevImage" class="absolute left-2 top-1/2 -translate-y-1/2 text-white text-3xl hover:text-gray-300">
                &larr;
            </button>
            <!-- 下一张按钮 -->
            <button id="nextImage" class="absolute right-2 top-1/2 -translate-y-1/2 text-white text-3xl hover:text-gray-300">
                &rarr;
            </button>
            <!-- 预览图片 -->
            <img id="modalImage" src="" alt="预览图" class="w-full max-h-[80vh] object-contain">
            <!-- 图片描述 -->
            <p id="modalImageDesc" class="text-white text-center mt-2"></p>
        </div>
    </div>
    
    </main>

    <footer class="bg-primary text-white mt-12 py-6">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 科创筑翼 | 实业兴滨 </p>
        </div>
    </footer>

    <script>
        // 1. 地点数据
        const locations = [
            {
                id: 1,
                name: "滨州黄河楼",
                description: "滨州黄河楼主体建筑高79.1米，共有12层，气势恢宏，仿古式建筑风格，有传统的韵味，又不失现代的宏伟。设计理念源自于黄河流域的古城楼，飞檐翘角，雕梁画栋，屹立蒲湖之上，与湖水交相辉映，是滨州城市天际线中最醒目的风景。黄河楼也算是一座观景塔楼，每一层都是观光层，可以360度全景远眺滨州风光。",
                position:  [118.037452,37.364184],
                 images: [
     		 { src: "1.jpg", desc: "滨州黄河楼场景1" },
             
             

   		 ],
                audio: "",
                video: "2.mp4"
            },
            {
                id: 2,
                name: "滨州中海",
                description: "中海水利风景区总面积5.41平方公里，其中水体面积1.69平方公里，绿化面积2.91平方公里，是滨州市委、市政府为了进一步弘扬黄河水文化，让黄河水扮靓滨州，打造滨州城市品牌，加快城市化进程，而实施的一项集蓄水排涝、对外交通、绿色生态与休闲游憩功能为一体的“四环五海”宏伟工程，该工程由上海同济城市规划设计研究院规划设计，历经三年艰苦奋战使蓝图变为现实，臭气扑鼻的排污河成了绿树环抱的绕城河，杂草丛生的荒碱洼成了碧波荡漾的人工湖。",
                position: [117.951996,37.394459],
                images: [
     		 { src: "4.jpg", desc: "滨州中海场景1" },
             
             

   		 ],
                audio: "",
                video: "1.mp4"
            },
            {
                id: 3,
                name: "麻大湖国家湿地公园",
                description: "麻大湖坐落于滨州市博兴县城南3公里处，10万余亩的广阔水域，与周边河流相连，水源充沛。景区内亭台楼阁精巧，栈桥蜿蜒，湖畔湿地景观丰富，是众多鸟类的栖息地。可以漫步在森林木栈道上，听鸟儿欢唱，看芦苇摇曳；也可以乘船游览，穿梭在水道间，感受水乡的独特韵味。",
                position: [118.096965,37.102689],
                 images: [
     		 { src: "7.jpg", desc: "麻大湖国家湿地公园场景1" },
             
             

   		 ],
                audio: "",
                video: "3.mp4"
            },
            {
                id: 4,
                name: "滨州市博物馆",
                description: "滨州市博物馆创办于2015年，是一家集教育、研究、欣赏、收藏、保护于一体的综合地志类博物馆，建筑面积12753平方米，展陈面积5350余平方米，馆藏文物10000余件/套，种类涉及陶瓷器、玉器、青铜器、金银器、漆木器、骨角蚌器、佛教造像、字画、古籍等十多类。身处兵圣故里，孙子文化正是滨州市博物馆重点保护、解读、推介内容。在这里，建有孙子文化展厅，展出孙子兵法和孙子文化相关的展品195件/套；建有“孙子书库”，藏书1万余册、数字资源6万余条。",
                position: [117.978019,37.411045],
images: [
     		 { src: "13.jpg", desc: "滨州市博物馆场景1" },
             
             

   		 ],
                audio: "",
                video: "5.mp4"
            },
            
        ];

        // 全局变量
        let baiduMap; 
        let markerList = []; 

        // DOM元素
        const mapContainer = document.getElementById('map');
        const infoBox = document.getElementById('infoBox');
        const locationTitle = document.getElementById('locationTitle');
        const locationContent = document.getElementById('locationContent');
        const closeInfo = document.getElementById('closeInfo');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const resetMapBtn = document.getElementById('resetMap');
        const locationsList = document.getElementById('locationsList');

        // 2. 初始化地图
        window.onload = function() {
            initBaiduMap();
        };

        // 3. 初始化百度地图
        function initBaiduMap() {
            const pingzhuangCenter = new BMapGL.Point(117.97,37.38); // 赤峰平庄的经纬度
            baiduMap = new BMapGL.Map("map");
            baiduMap.centerAndZoom(pingzhuangCenter, 14);// 缩放级别可根据需要调整（3-19，越大越详细）
            baiduMap.enableScrollWheelZoom(true);
            baiduMap.enableDragging(true);

            // 地图加载完成后执行
            baiduMap.addEventListener('tilesloaded', function() {
                console.log("百度地图加载完成");
                addBaiduMapMarkers();
                generateLocationsList();
                bindControlEvents();
            });
        }

        // 4. 绑定控制按钮事件
        function bindControlEvents() {
            zoomInBtn.addEventListener('click', () => baiduMap.zoomIn());
            zoomOutBtn.addEventListener('click', () => baiduMap.zoomOut());
            resetMapBtn.addEventListener('click', () => {
                const pingzhuangCenter = new BMapGL.Point(117.97,37.38);//重置改这里
                baiduMap.centerAndZoom(pingzhuangCenter, 14);
                infoBox.classList.add('hidden');
            });
           closeInfo.addEventListener('click', () => {
  console.log('尝试关闭信息窗，当前类名：', infoBox.className);
  infoBox.classList.add('hidden');
   infoBox.style.display = 'none'; 
  console.log('关闭后类名：', infoBox.className);
});
             baiduMap.addEventListener('click', (e) => {
        // 判断点击目标是否在 infoBox 内部
        if (!infoBox.contains(e.target)) {
            infoBox.classList.add('hidden');
        }
    });
        }

        // 5. 添加地图标记
        function addBaiduMapMarkers() {
            locations.forEach(location => {
                const point = new BMapGL.Point(location.position[0], location.position[1]);
                const markerIcon = new BMapGL.Icon(
                    `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%231E40AF"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`,
                    new BMapGL.Size(32, 32)
                );
                const marker = new BMapGL.Marker(point, { icon: markerIcon });
                marker.setTitle(location.name);
                marker.locationData = location;

                // 标记点击事件
                marker.addEventListener('click', () => {
                    console.log("标记点击触发：", location.name);
                    showLocationInfo(location, marker);
                });

                baiduMap.addOverlay(marker);
                markerList.push(marker);
            });
        }

        // 6. 显示信息窗（核心修复：语法错误+样式冲突）
        function showLocationInfo(location,marker) {
        // 1. 转换经纬度为像素坐标（使用传入的 marker）
    const pixel = baiduMap.pointToOverlayPixel(marker.getPosition()); // 现在 marker 已定义
    
    // 2. 计算信息窗位置（后续逻辑不变）
    const infoBoxWidth = infoBox.offsetWidth || 300;
    const left = pixel.x - infoBoxWidth / 2;
    const top = pixel.y + 32;
    infoBox.style.left = `${Math.max(10, Math.min(left, mapContainer.offsetWidth - infoBoxWidth - 10))}px`;
    infoBox.style.top = `${Math.max(10, top)}px`;

    // 3. 填充内容、显示信息窗（后续逻辑不变）

            // 2. 填充内容（确保内容可见）
  locationTitle.textContent = location.name;
            locationContent.innerHTML = `
                <div class="prose max-w-none">${location.description.replace(/\n/g, '<br>')}</div> 
		<!--<p class="text-gray-700">${location.description}</p>-->
                
${location.images && location.images.length > 0 ? `
  <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
    ${location.images.map((img, index) => `
      <div class="group">
        <img 
          src="${img.src}" 
          alt="${img.desc}" 
          class="w-full h-48 object-cover rounded-md shadow-sm transition-transform duration-300 group-hover:scale-105 cursor-pointer hover:ring-2 hover:ring-primary"
          onclick="openImageModal(${location.id}, ${index})"  <!-- 点击小图触发大图预览 -->
        >
        <p class="text-xs text-gray-500 mt-1 italic text-center">${img.desc}</p>
      </div>
    `).join('')}
  </div>
` : ''}
                
                ${location.audio ? `
                    <div class="mt-3">
                        <p class="text-sm font-medium text-gray-700 mb-1">
                            <i class="fa fa-volume-up text-primary mr-1"></i>地点语音介绍
                        </p>
                        <audio controls class="w-full">
                            <source src="${location.audio}" type="audio/mpeg">
                            您的浏览器不支持音频播放
                        </audio>
                    </div>
                ` : ''}
                
                ${location.video ? `
                    <div class="mt-3">
                        <p class="text-sm font-medium text-gray-700 mb-1">
                            <i class="fa fa-film text-primary mr-1"></i>地点视频介绍
                        </p>
                        <video controls class="w-full h-48 object-cover rounded-md shadow-sm">
                            <source src="${location.video}" type="video/mp4">
                            您的浏览器不支持视频播放
                        </video>
                    </div>
                ` : ''}
            `;

            // 3. 强制显示（修复语法错误）
            console.log('尝试显示信息窗');
            console.log('移除前的类名：', infoBox.className);
            infoBox.classList.remove('hidden');
            console.log('移除后的类名：', infoBox.className);
             infoBox.style.display = 'block'; //补充分号，修复语法错误
            infoBox.style.opacity = '1';
            infoBox.style.visibility = 'visible';
            infoBox.style.zIndex = '1000';
        }

        // 7. 生成地点列表
        function generateLocationsList() {
            locationsList.innerHTML = '';
            locations.forEach(location => {
                const card = document.createElement('div');
                card.className = 'border border-gray-200 rounded-lg overflow-hidden hover:shadow-md transition-shadow';
                card.innerHTML = `
                    <div class="h-40 overflow-hidden">
                       <img 
        src="${location.images && location.images.length > 0 
            ? location.images[0].src  // 有 images 数组时，取第一张图
            : location.image || 'https://picsum.photos/id/1015/600/400'}"  // 否则用单图或默认图
        alt="${location.images && location.images.length > 0 
            ? location.images[0].desc  // 有 images 数组时，取第一张图的描述
            : location.imageDesc || location.name}"  // 否则用单图描述或地点名
        class="w-full h-full object-cover hover:scale-105 transition-transform duration-300"
    >
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg text-dark">${location.name}</h3>
                        <p class="text-gray-600 text-sm mt-1 line-clamp-2">${location.description}</p>
                        <button class="mt-3 text-primary hover:text-primary/80 text-sm font-medium flex items-center" 
                                data-id="${location.id}">
                            <i class="fa fa-map-marker mr-1"></i> 在地图上查看
                        </button>
                    </div>
                `;
                locationsList.appendChild(card);

                // 列表点击事件
card.querySelector('button').addEventListener('click', () => {
    const targetMarker = markerList.find(marker => marker.locationData.id === location.id);
    if (targetMarker) {
        baiduMap.panTo(targetMarker.getPosition()); // 地图移动到标记位置
        showLocationInfo(location, targetMarker);   // 直接调用显示信息窗的函数
        mapContainer.scrollIntoView({ behavior: 'smooth', block: 'start' }); // 滚动到地图
    }
});
            });
        }
    
    // 全局变量：记录当前预览的图片信息
let currentLocationId = null;
let currentImageIndex = null;

// 打开大图模态框
function openImageModal(locationId, imageIndex) {
  // 记录当前图片的位置信息
  currentLocationId = locationId;
  currentImageIndex = imageIndex;
  
  // 找到对应的地点数据
  const location = locations.find(item => item.id === locationId);
  if (!location) return;
  
  // 获取当前图片信息
  const currentImage = location.images[imageIndex];
  if (!currentImage) return;
  
  // 更新模态框内容
  document.getElementById('modalImage').src = currentImage.src;
  document.getElementById('modalImageDesc').textContent = currentImage.desc;
  
  // 显示模态框
  document.getElementById('imageModal').classList.remove('hidden');
}

// 关闭模态框
document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('imageModal').classList.add('hidden');
});

// 点击模态框背景关闭
document.getElementById('imageModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('imageModal')) {
    document.getElementById('imageModal').classList.add('hidden');
  }
});

// 切换到上一张图片
document.getElementById('prevImage').addEventListener('click', () => {
  if (currentLocationId === null || currentImageIndex === null) return;
  
  const location = locations.find(item => item.id === currentLocationId);
  if (!location) return;
  
  // 计算上一张索引（循环切换）
  currentImageIndex = (currentImageIndex - 1 + location.images.length) % location.images.length;
  const prevImage = location.images[currentImageIndex];
  
  // 更新图片
  document.getElementById('modalImage').src = prevImage.src;
  document.getElementById('modalImageDesc').textContent = prevImage.desc;
});

// 切换到下一张图片
document.getElementById('nextImage').addEventListener('click', () => {
  if (currentLocationId === null || currentImageIndex === null) return;
  
  const location = locations.find(item => item.id === currentLocationId);
  if (!location) return;
  
  // 计算下一张索引（循环切换）
  currentImageIndex = (currentImageIndex + 1) % location.images.length;
  const nextImage = location.images[currentImageIndex];
  
  // 更新图片
  document.getElementById('modalImage').src = nextImage.src;
  document.getElementById('modalImageDesc').textContent = nextImage.desc;
});

// 支持键盘操作（左右箭头切换，ESC关闭）
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('imageModal').classList.contains('hidden')) {
    if (e.key === 'Escape') {
      document.getElementById('imageModal').classList.add('hidden');
    } else if (e.key === 'ArrowLeft') {
      document.getElementById('prevImage').click();
    } else if (e.key === 'ArrowRight') {
      document.getElementById('nextImage').click();
    }
  }
});
    
    
    </script>
</body>
</html>
